<svg fill="none" height="150" width="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Cleaned from Untitled file.svg: 2s loop, green accept, icon never hides -->
  <g transform="translate(75,75)">
    <!-- ripple 1 -->
    <g opacity="0.25">
      <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.25;0.25;0;0" keyTimes="0;0.085;0.492;1"/>
      <ellipse rx="75" ry="75" fill="#ffffff">
        <animateTransform attributeName="transform" type="scale" dur="2s" repeatCount="indefinite"
          values="0.622;0.622;1;1" keyTimes="0;0.051;0.492;1"
          keySplines="0 0 1 1;0.167 0.167 0.314 1;0 0 1 1" calcMode="spline"/>
      </ellipse>
    </g>
    <!-- ripple 2 -->
    <g opacity="0">
      <animate attributeName="opacity" dur="2s" repeatCount="indefinite" begin="0.17s" values="0.25;0.25;0;0" keyTimes="0;0.085;0.492;1"/>
      <ellipse rx="75" ry="75" fill="#ffffff">
        <animateTransform attributeName="transform" type="scale" dur="2s" repeatCount="indefinite" begin="0.17s"
          values="0.622;0.622;1;1" keyTimes="0;0.051;0.492;1"
          keySplines="0 0 1 1;0.167 0.167 0.314 1;0 0 1 1" calcMode="spline"/>
      </ellipse>
    </g>
    <!-- ripple 3 -->
    <g opacity="0">
      <animate attributeName="opacity" dur="2s" repeatCount="indefinite" begin="0.34s" values="0.25;0.25;0;0" keyTimes="0;0.085;0.492;1"/>
      <ellipse rx="75" ry="75" fill="#ffffff">
        <animateTransform attributeName="transform" type="scale" dur="2s" repeatCount="indefinite" begin="0.34s"
          values="0.622;0.622;1;1" keyTimes="0;0.051;0.492;1"
          keySplines="0 0 1 1;0.167 0.167 0.314 1;0 0 1 1" calcMode="spline"/>
      </ellipse>
    </g>
    <!-- green button (scale pulse only) -->
    <ellipse rx="75" ry="75" fill="#16a34a" transform="scale(0.622)">
      <animateTransform attributeName="transform" type="scale" dur="2s" repeatCount="indefinite"
        values="0.622;0.622;0.702;0.622;0.622" keyTimes="0;0.051;0.492;0.933;1"
        keySplines="0 0 1 1;0.333 0 0.667 1;0.333 0 0.667 1;0 0 1 1" calcMode="spline"/>
    </ellipse>
