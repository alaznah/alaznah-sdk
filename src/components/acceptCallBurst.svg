      <path fill="#ffffff" d="M-23.013,-21.156C-24.803,-17.182,-27.335,-10.896,-20.109,0.263C-15.207,8.563,-4.762,18.424,-4.762,18.424C-4.762,18.424,9,29.75,20.625,21.75C31.136,15.44,18.189,6.324,14.75,5.5C9.375,6.437,10.25,9.875,6,10.125C1.75,10.375,-9.246,-4.333,-9.5,-6.875C-7.875,-11.375,-5.72,-11.097,-5.114,-15.082C-4.816,-18.423,-15.848,-34.96,-23.013,-21.156Z"/>
