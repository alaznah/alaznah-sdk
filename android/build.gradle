buildscript {
  // Defaults target RN 0.76–0.80 (compileSdk 35). Hosts on 0.81+ (36) inherit rootProject.
  ext.AlaznahCalling = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 35,
    targetSdkVersion: 35
  ]

  ext.getExtOrDefault = { prop ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : AlaznahCalling[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "com.facebook.react"

android {
  namespace "com.alaznah.calling"
  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    targetSdkVersion getExtOrDefault("targetSdkVersion")
    consumerProguardFiles "consumer-rules.pro"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
  // 1.15.x works with compileSdk 35 (RN 0.76–0.80) and 36 (RN 0.81+).
  // Do not bump to 1.17+ — it forces compileSdk 36 and breaks default RN 0.80 apps.
  implementation "androidx.core:core:1.15.0"
  implementation "androidx.activity:activity-ktx:1.9.3"
  // org.webrtc.* (EglRenderer, VideoTrack) at compile time only. Prefer the
  // autolinked react-native-webrtc project so we do not resolve a second
  // org.jitsi:webrtc AAR — that extra transform races Gradle's results.bin
  // snapshot of the exploded react-android prefab and fails CMake configure.
  def webrtcProject = rootProject.findProject(":react-native-webrtc")
  if (webrtcProject != null) {
    compileOnly webrtcProject
  } else {
    compileOnly "org.jitsi:webrtc:124.0.0"
  }
}
